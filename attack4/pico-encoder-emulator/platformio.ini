; PlatformIO project: rotary-encoder emulator for physical PIN brute-force
; Target board: Raspberry Pi Pico (RP2040) acting as the ATTACKER.
; Framework: arduino-pico (earlephilhower core) via the maxgerhardt platform fork,
; which is the documented way to build the arduino-pico core under PlatformIO.
;
; Build & flash:
;   pio run -t upload          # hold BOOTSEL on first flash if no USB serial yet
;   pio device monitor         # 115200 baud serial console (jog + brute-force)

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Expose the USB CDC serial console used by the control UI.
build_flags = -DUSBD_MANUFACTURER=\"attack4\" -DUSBD_PRODUCT=\"enc-emu\"
