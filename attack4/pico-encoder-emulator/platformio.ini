; PlatformIO project: rotary-encoder emulator for physical PIN brute-force
; Target board: Raspberry Pi Pico (RP2040) acting as the ATTACKER.
; Framework: arduino-pico (earlephilhower core) via the maxgerhardt platform fork,
; which is the documented way to build the arduino-pico core under PlatformIO.
;
; Build & flash:
;   pio run -t upload          # hold BOOTSEL on first flash if no USB serial yet
;   pio device monitor         # 115200 baud serial console (jog + brute-force)

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Pin the port to the Pico CDC pattern, else PlatformIO auto-detect may grab a
; motherboard UART (/dev/ttyS0) and the 1200bps upload reset touches the wrong
; port. PlatformIO matches this against the device node (/dev/ttyACM0), so the
; pattern is /dev/ttyACM* -- it selects the Pico and excludes ttyS0/ttyUSB, and
; stays portable to any Pico (no board-specific serial).
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
; Expose the USB CDC serial console used by the control UI.
build_flags = -DUSBD_MANUFACTURER=\"attack4\" -DUSBD_PRODUCT=\"enc-emu\"
